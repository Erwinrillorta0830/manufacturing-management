name: CD Pipeline

on:
  push:
    branches: [master]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted 
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Pull Code, Build, and Restart
        run: |
          set -e
          cd /home/vertex/manufacturing-management
          git fetch --all
          git reset --hard origin/master
          node --version
          npm --version
          npm ci
          npm run build
          pm2 restart "manufacturing-management" || pm2 start npm --name "manufacturing-management" -- start

