name: CD Pipeline

on:
  push:
    branches: [master]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted 
    timeout-minutes: 20

    steps:
      - name: Pull Code, Build, and Restart
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8055
          NEXT_PUBLIC_DIRECTUS_URL: http://localhost:8055
          DIRECTUS_STATIC_TOKEN: placeholder
          DIRECTUS_TOKEN: placeholder
          NEXT_PUBLIC_DIRECTUS_STATIC_TOKEN: placeholder
        run: |
          cd /home/vertex/manufacturing-management
          git fetch --all
          git reset --hard origin/master
          npm ci
          npm run build
          pm2 restart "manufacturing-management" || pm2 start npm --name "manufacturing-management" -- start
