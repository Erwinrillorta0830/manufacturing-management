name: Deploy Next.js

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: self-hosted # <--- This tells GitHub to use your Ubuntu server
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Restart PM2
        run: pm2 restart "my-next-app" || pm2 start npm --name "my-next-app" -- start
